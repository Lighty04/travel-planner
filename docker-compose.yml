version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: travel-planner-db
    environment:
      POSTGRES_USER: travelplanner
      POSTGRES_PASSWORD: travelplanner
      POSTGRES_DB: travel_planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
